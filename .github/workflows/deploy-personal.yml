name: Deploy to Personal AWS

on:
  push:
    branches:
      - main

jobs:
  deploy-frontend:
    name: Build & Deploy Frontend (Personal)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate environment config
        run: |
          mkdir -p src/environments
          cat > src/environments/environments.ts << EOF
          export const environments = {
            production: true,
            apiUrl: '${{ secrets.PERSONAL_API_URL }}',
            cognito: {
              userPoolId: '${{ secrets.PERSONAL_COGNITO_USER_POOL_ID }}',
              userPoolClientId: '${{ secrets.PERSONAL_COGNITO_CLIENT_ID }}',
            },
          };
          EOF

      - name: Build Angular app
        run: npx ng build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.PERSONAL_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.PERSONAL_AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.PERSONAL_AWS_REGION }}

      - name: Deploy to S3
        run: |
          aws s3 sync dist/customer-tech-enquiry-analysis/browser/ \
            s3://${{ secrets.PERSONAL_S3_BUCKET }} \
            --delete

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.PERSONAL_CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"

  deploy-lambda:
    name: Deploy Lambda (Personal)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install analyse-enquiry dependencies
        run: cd lambdas/analyse-enquiry && npm ci

      - name: Install db-warmup dependencies
        run: cd lambdas/db-warmup && npm ci

      - name: Package Lambdas
        run: |
          cd lambdas/analyse-enquiry && zip -r function.zip index.js node_modules/
          cd ../db-warmup && zip -r function.zip index.js node_modules/

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.PERSONAL_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.PERSONAL_AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.PERSONAL_AWS_REGION }}

      - name: Deploy analyse-enquiry Lambda
        run: |
          aws lambda update-function-code \
            --function-name ${{ secrets.PERSONAL_LAMBDA_FUNCTION_NAME }} \
            --zip-file fileb://lambdas/analyse-enquiry/function.zip

      - name: Deploy db-warmup Lambda
        run: |
          aws lambda update-function-code \
            --function-name ${{ secrets.PERSONAL_DB_WARMUP_FUNCTION_NAME }} \
            --zip-file fileb://lambdas/db-warmup/function.zip
