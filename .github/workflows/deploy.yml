name: Deploy to AWS

on:
  push:
    branches:
      - deploy-company  # disabled — company account pending Bedrock approval

jobs:
  deploy-frontend:
    name: Build & Deploy Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate environment config
        run: |
          mkdir -p src/environments
          cat > src/environments/environments.ts << EOF
          export const environments = {
            production: true,
            apiUrl: '${{ secrets.API_URL }}',
            cognito: {
              userPoolId: '${{ secrets.COGNITO_USER_POOL_ID }}',
              userPoolClientId: '${{ secrets.COGNITO_CLIENT_ID }}',
            },
          };
          EOF

      - name: Build Angular app
        run: npx ng build --configuration=production

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy to S3
        run: |
          aws s3 sync dist/customer-tech-enquiry-analysis/browser/ \
            s3://${{ secrets.S3_BUCKET }} \
            --delete

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"

  deploy-lambda:
    name: Deploy Lambda
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Lambda dependencies
        run: |
          cd lambdas/analyse-enquiry
          npm ci

      - name: Package Lambda
        run: |
          cd lambdas/analyse-enquiry
          zip -r function.zip index.js node_modules/

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy Lambda
        run: |
          aws lambda update-function-code \
            --function-name ${{ secrets.LAMBDA_FUNCTION_NAME }} \
            --zip-file fileb://lambdas/analyse-enquiry/function.zip
